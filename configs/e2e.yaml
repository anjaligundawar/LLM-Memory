# End-to-end QA with an LLM reader and judge (Experiment E4). Uses the Claude API.
# Start small: n_queries x conditions x modes x 2 calls.
out: results/e2e
cache_dir: cache
embedder: {name: sentence-transformers/all-MiniLM-L6-v2}
nli: {model: cross-encoder/nli-MiniLM2-L6-H768}
llm: {model: claude-opus-5-5, effort: low}
corpora:
  locomo: {}
  longmemeval: {max_stores: 60}
n_queries: 150
retriever: hybrid
k: 10
conditions: [[none, 0.0], [mixed, 0.5], [contradictory, 0.5]]
modes: [none, hard, gated]
