# Tiny offline run to check the pipeline works end to end (minutes on a laptop).
# Uses the hashing embedder and the overlap contradiction stand-in, so the
# numbers are NOT meaningful. Use configs/main.yaml for real results.
out: results/smoke
cache_dir: cache
embedder: {name: hashing}
nli: {model: overlap}
corpora:
  locomo: {max_stores: 2}
  clutrr: {max_stores: 5}
  loghub: {max_windows_per_system: 1}
pollution:
  types: [duplicate, contradictory, mixed]
  levels: [0.0, 0.5]
  seeds: [0]
  targeted: 0.5
retrievers: [dense, bm25, graph]
ks: [1, 3, 5, 10]
